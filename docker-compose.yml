services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exchange_rates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exchange_rates"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrator:
    build:
      context: .
      dockerfile: src/migrator/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=exchange_rates;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      postgres:
        condition: service_healthy

  users-api:
    build:
      context: .
      dockerfile: src/user/ExchangeRateViewer.Users.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=exchange_rates;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Secret: "${JWT_SECRET:-WuBbAlUbBaDuBdUb_GeTsHwIfTy!!!!1}"
    ports:
      - "5010:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  finance-api:
    build:
      context: .
      dockerfile: src/finance/ExchangeRateViewer.Finance.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=exchange_rates;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Secret: "${JWT_SECRET:-WuBbAlUbBaDuBdUb_GeTsHwIfTy!!!!1}"
    ports:
      - "5020:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  exchange-rate-monitor:
    build:
      context: .
      dockerfile: src/monitor/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=exchange_rates;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      migrator:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "${JWT_SECRET:-WuBbAlUbBaDuBdUb_GeTsHwIfTy!!!!1}"
      ReverseProxy__Clusters__users-cluster__Destinations__destination1__Address: "http://users-api:8080"
      ReverseProxy__Clusters__finance-cluster__Destinations__destination1__Address: "http://finance-api:8080"
    ports:
      - "5050:8080"
    depends_on:
      users-api:
        condition: service_started
      finance-api:
        condition: service_started

volumes:
  pgdata:
